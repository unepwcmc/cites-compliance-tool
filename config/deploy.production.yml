# Name of the container image
image: ghcr.io/unepwcmc/cites-compliance-tool/rails-production

servers:
  web:
    hosts:
      - example.com # TODO: Ruan
    proxy:
      hosts:
        - cites-trade-tool.speciesplus.net # Public-facing domain
      ssl: true # Proxy terminates SSL
      forward_headers: true # Forward headers like X-Forwarded-Proto
      healthcheck:
        path: /up
      logging:
        request_headers:
          - Cache-Control
          - User-Agent
          - X-Forwarded-Proto # Critical for Rails to detect HTTPS
        response_headers:
          - X-Request-ID

# Environment variables
env:
  clear:
    RAILS_ENV: production
    SPECIES_API_URL: https://sapi.sapi-production.linode.unep-wcmc.org/api/v1
    CERTIFICATE_PATH: "" # Deprecated
    MAILER_HOST: https://cites-trade-tool.speciesplus.net
