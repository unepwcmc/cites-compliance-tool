# No ghcr.io/ prefix — Kamal prepends localhost:5555/ from config/deploy.yml
image: unepwcmc/cites-compliance-tool/rails-production

servers:
  web:
    hosts:
      - sapi-web-prod-01.linode.unep-wcmc.org
    options:
      add-host: host.docker.internal:host-gateway
    proxy:
      hosts:
        - cites-compliance-tool-sapi-web-prod-01.linode.unep-wcmc.org
      ssl: true
      logging:
        request_headers:
          - Cache-Control
          - User-Agent
          - X-Forwarded-Proto # Critical for Rails to detect HTTPS
        response_headers:
          - X-Request-ID

# Build remotely on the production web server, same host the app deploys to.
builder:
  remote: ssh://wcmc@sapi-web-prod-01.linode.unep-wcmc.org

# Environment variables
env:
  clear:
    RAILS_ENV: production
    # This lower-traffic app needs one Puma worker on the shared VM. Remove the
    # explicit value after Puma 5+ if the default single-process mode is desired.
    WEB_CONCURRENCY: 1
    # The database pool reads this value, so keep it equal to Puma's threads.
    RAILS_MAX_THREADS: 5
    # Points at our new Proxmox SAPI via the Cloudflare Tunnel preflight domain rather
    # than the old public www.speciesplus.net — internal-only *.internal.unep-wcmc.org
    # hostnames don't resolve from inside sibling containers (only host-level /etc/hosts).
    SPECIES_API_URL: https://sapi-web-prod-01.linode.unep-wcmc.org/api/v1
    CERTIFICATE_PATH: "" # Deprecated
    MAILER_HOST: https://cites-compliance-tool-sapi-web-prod-01.linode.unep-wcmc.org
